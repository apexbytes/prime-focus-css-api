services:
  postgres:
    image: postgres:16-alpine
    container_name: prime-focus-css-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: css
      POSTGRES_PASSWORD: css
      POSTGRES_DB: prime_focus_css
      # Deterministic ordering and timestamps regardless of the host locale.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
      TZ: UTC
    ports:
      # 5434 on the host: 5432/5433 are commonly already taken by a local
      # Postgres or another project. Container-internal port is unchanged.
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U css -d prime_focus_css']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prime-focus-css-cache
    restart: unless-stopped
    # Rate-limit counters and cached lookups are all reconstructible, so there
    # is no volume: a restart costs a cold cache and nothing else. The socket
    # adapter's rooms are re-established by clients reconnecting.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      # 6381 on the host, following the database's 5434: 6379 is commonly
      # already taken. Container-internal port is unchanged.
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
